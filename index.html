<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Generator</title>
  <script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #5f6b7a;
      --border: #d8dde4; --accent: #2457d6; --accent-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa4b2;
        --border: #343a44; --accent: #6b93ff; --accent-text: #0d1220;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 860px; margin: 0 auto; display: grid; gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    h1 { max-width: 860px; margin: 0 auto 16px; font-size: 1.4rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
    label { display: block; margin-bottom: 14px; font-weight: 600; font-size: .9rem; }
    label.inline { display: flex; align-items: center; gap: 8px; font-weight: 400; }
    input[type=text], input[type=password], input[type=number], select, textarea {
      display: block; width: 100%; margin-top: 4px; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit;
    }
    textarea { resize: vertical; min-height: 6em; }
    .tabs { display: flex; gap: 0; margin-bottom: 16px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .tabs label { flex: 1; margin: 0; text-align: center; cursor: pointer; }
    .tabs input { position: absolute; opacity: 0; pointer-events: none; }
    .tabs span { display: block; padding: 8px; }
    .tabs input:checked + span { background: var(--accent); color: var(--accent-text); }
    .tabs input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
    input[type=file] { display: block; margin-top: 4px; font: inherit; color: var(--muted); max-width: 100%; }
    input[type=range] { width: 100%; }
    .row { display: flex; gap: 12px; }
    .row > label { flex: 1; }
    .hint { color: var(--muted); font-size: .82rem; font-weight: 400; }
    #preview { display: flex; justify-content: center; }
    #preview svg { width: 100%; height: auto; max-width: 360px; }
    code { display: block; margin: 12px 0; padding: 8px; background: var(--bg); border-radius: 6px;
           font-size: .8rem; word-break: break-all; color: var(--muted); }
    button {
      width: 100%; padding: 10px; border: 0; border-radius: 6px; cursor: pointer;
      background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <main>
    <form class="card" id="form" autocomplete="off">
      <div class="tabs" role="radiogroup" aria-label="Content type">
        <label><input type="radio" name="mode" value="wifi" checked><span>Wi-Fi</span></label>
        <label><input type="radio" name="mode" value="raw"><span>Text / URL</span></label>
      </div>
      <div id="raw-fields" hidden>
        <label>Content <span class="hint">(URL or any text, encoded as-is)</span>
          <textarea name="raw" rows="4" placeholder="https://example.com"></textarea>
        </label>
      </div>
      <div id="wifi-fields">
        <label>Network name (SSID)
          <input type="text" name="ssid" required>
        </label>
        <label>Password
          <input type="password" name="password">
        </label>
        <label class="inline"><input type="checkbox" id="show-pw"> Show password</label>
        <label>Encryption
          <select name="auth">
            <option value="WPA" selected>WPA / WPA2 / WPA3</option>
            <option value="WEP">WEP</option>
            <option value="nopass">None (open network)</option>
          </select>
        </label>
        <label class="inline"><input type="checkbox" name="hidden"> Hidden network</label>
      </div>
      <div class="row">
        <label>Width (px) <input type="number" name="width" value="300" min="100" max="4000" step="10"></label>
        <label>Height (px) <input type="number" name="height" value="300" min="100" max="4000" step="10"></label>
      </div>
      <label>Center image <span class="hint">(PNG, JPG or SVG)</span>
        <input type="file" name="logo" accept="image/*">
      </label>
      <label>Image size <span class="hint" id="size-out"></span>
        <input type="range" name="imageSize" min="0.15" max="0.5" step="0.05" value="0.3">
      </label>
      <div class="row">
        <label>Dots <input type="color" name="fg" value="#000000"></label>
        <label>Background <input type="color" name="bg" value="#ffffff"></label>
        <label>Style
          <select name="dotType">
            <option value="square" selected>Square</option>
            <option value="rounded">Rounded</option>
            <option value="dots">Dots</option>
            <option value="classy-rounded">Classy</option>
          </select>
        </label>
      </div>
      <p class="hint">Everything is generated in your browser — nothing is uploaded.
        Always test-scan with an iPhone and an Android phone before printing.</p>
    </form>

    <section class="card">
      <div id="preview"></div>
      <code id="payload"></code>
      <button type="button" id="download" disabled>Download SVG</button>
    </section>
  </main>

  <script>
    const form = document.getElementById('form');
    const payloadEl = document.getElementById('payload');
    const downloadBtn = document.getElementById('download');
    let logoDataUrl = '';

    // Escape special chars per the de-facto WIFI: QR format (ZXing).
    const esc = s => s.replace(/([\\;,:"])/g, '\\$1');

    const isWifi = () => form.elements.mode.value === 'wifi';
    const payload = () => isWifi() ? wifiPayload() : form.elements.raw.value;

    function wifiPayload() {
      const f = form.elements;
      const auth = f.auth.value;
      let s = `WIFI:T:${auth};S:${esc(f.ssid.value)};`;
      if (auth !== 'nopass') s += `P:${esc(f.password.value)};`;
      if (f.hidden.checked) s += 'H:true;';
      return s + ';';
    }

    // Fall back to 300px while a size field is empty or mid-edit.
    const px = v => Math.min(4000, Math.max(100, Math.round(Number(v)) || 300));

    function options() {
      const f = form.elements;
      return {
        type: 'svg',
        width: px(f.width.value),
        height: px(f.height.value),
        margin: 16,
        data: payload(),
        image: logoDataUrl, // '' = no image
        qrOptions: { errorCorrectionLevel: 'H' },
        dotsOptions: { type: f.dotType.value, color: f.fg.value },
        cornersSquareOptions: { color: f.fg.value },
        cornersDotOptions: { color: f.fg.value },
        backgroundOptions: { color: f.bg.value },
        imageOptions: { hideBackgroundDots: true, imageSize: Number(f.imageSize.value), margin: 6 },
      };
    }

    const qr = new QRCodeStyling(options());
    qr.append(document.getElementById('preview'));

    function render() {
      const f = form.elements;
      document.getElementById('size-out').textContent = `(${Math.round(f.imageSize.value * 100)}%)`;
      const wifi = isWifi();
      document.getElementById('wifi-fields').hidden = !wifi;
      document.getElementById('raw-fields').hidden = wifi;
      f.password.disabled = f.auth.value === 'nopass';
      const ready = wifi ? f.ssid.value.trim() !== '' : f.raw.value.trim() !== '';
      downloadBtn.disabled = !ready;
      payloadEl.textContent = ready ? payload()
        : wifi ? 'Enter a network name to generate the code.' : 'Enter a URL or text to generate the code.';
      // Empty data only happens in raw mode; hide instead of showing a stale code.
      const preview = document.getElementById('preview');
      preview.hidden = payload() === '';
      if (!preview.hidden) qr.update(options());
    }

    form.addEventListener('input', render);

    form.elements.logo.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) { logoDataUrl = ''; render(); return; }
      // Embed as data URL so the downloaded SVG is self-contained.
      const reader = new FileReader();
      reader.onload = () => { logoDataUrl = reader.result; render(); };
      reader.readAsDataURL(file);
    });

    document.getElementById('show-pw').addEventListener('change', e => {
      form.elements.password.type = e.target.checked ? 'text' : 'password';
    });

    downloadBtn.addEventListener('click', () => {
      const f = form.elements;
      let label = f.ssid.value;
      if (!isWifi()) {
        try { label = new URL(f.raw.value.trim()).hostname; } catch { label = ''; }
      }
      const name = (isWifi() ? 'wifi-' : 'qr-') + (label.trim().replace(/[^\w-]+/g, '_') || 'code');
      qr.download({ name, extension: 'svg' });
    });

    render();
  </script>
</body>
</html>
